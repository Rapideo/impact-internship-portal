project_id = "impact-dev"

# Auth configuration. Mostly defaults; the one non-default item is the
# Custom Access Token Hook that copies profile.role + profile.employer_id
# into the JWT. Without this hook the app's getClaims() returns no role
# claim and every login fails with "Account configured incorrectly".
[auth]
# These govern the LOCAL stack (`supabase start`, which CI uses) only. The
# cloud projects impact-dev and impact-prod are configured in their own
# dashboards under Authentication -> URL Configuration, and this file does
# not push to them.
#
# Supabase silently DISCARDS a `redirectTo` that is not on the allow list and
# substitutes site_url instead — no error, the mail just points somewhere
# useless. That is what the scaffold default `http://localhost:3000` caused
# (our dev server is on 5173, so it was never a real address): recovery and
# invite links resolved to a dead host. Keep site_url and the allow list in
# step with where the app actually runs.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**"]

[auth.mfa]
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
